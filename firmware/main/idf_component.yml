## IDF Component Manager manifest.
## Run `idf.py update-dependencies` to resolve; versions below are deliberately
## loose because the ESP-Hosted / esp_wifi_remote pair must match whatever slave
## firmware Elecrow flashed onto the C6. Pin them once the board boots.
dependencies:
  idf:
    version: ">=5.3"

  ## --- Networking: the P4 has no radio; these proxy Wi-Fi to the ESP32-C6 ---
  espressif/esp_wifi_remote:
    version: "*"
  ## Pinned to the pair Elecrow's own Wi-Fi lesson uses, which is the
  ## combination their factory C6 firmware actually speaks:
  ##   example/V1.0/idf-code/Lesson17-Wi-Fi_function/ESP32_P4-softAP/
  ##     main/idf_component.yml  ->  esp_hosted ~2.7.0, esp_wifi_remote ^0.16.1
  ##
  ## Do not infer the version from the firmware file Elecrow ships under
  ## "Firmware_Upgrade_Guide/..._V2.12.3_...": that is an optional UPGRADE, not
  ## what the board leaves the factory with. Pinning 2.12.3 to match that name
  ## still failed.
  ##
  ## The failure signature for a mismatch: SDIO enumerates fine ("Card init
  ## success", "Open data path at slave") and then the protocol on top never
  ## completes -- "Not able to connect with ESP-Hosted slave device" -- and the
  ## retry loop eventually reboots the board.
  espressif/esp_hosted:
    version: "==2.12.3"

  ## --- Display: EK79007 over MIPI-DSI, GT911 touch over I2C ---
  espressif/esp_lcd_ek79007:
    version: "*"
  espressif/esp_lcd_touch_gt911:
    version: "*"

  ## --- UI ---
  ## LVGL pinned to the 9.2.x line: that is what SquareLine Studio 1.5.1 emits
  ## and what the Elecrow examples are written against.
  lvgl/lvgl:
    version: "~9.2.2"
  ## Pinned deliberately. 2.8.0 requires LVGL >= 9.3 (RGB565_SWAPPED) and
  ## 2.9.0 requires IDF >= 5.6 (the DPI callback was renamed to
  ## on_frame_buf_complete). 2.7.2 is the last release that builds against
  ## IDF 5.5.3 + LVGL 9.2.2. Revisit only when moving both forward together.
  espressif/esp_lvgl_port:
    version: "~2.7.2"
    ## Built from the local copy, not the registry one. That copy stops a
    ## transient GT911 I2C error calling abort() -- see
    ## components/esp_lvgl_port/README.md.
    ##
    ## override_path is the mechanism that actually works. Simply dropping a
    ## directory into components/ does NOT override a managed component: the
    ## managed one is named "espressif__esp_lvgl_port", so a local
    ## "esp_lvgl_port" is a different component that nothing depends on, and it
    ## is silently never compiled.
    override_path: "../components/esp_lvgl_port"

  ## mDNS for http://tempest.local (web dashboard hostname).
  espressif/mdns:
    version: "*"
